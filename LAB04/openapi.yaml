openapi: 3.0.3
info:
  title: SCM Email Service REST API - Assignment 4
  version: 1.0.0
  description: Spring Boot REST implementation of the Email service from the previous SCM service design.
servers:
  - url: http://localhost:8090
paths:
  /api/v1/emails:
    post:
      summary: Queue an email for a contact
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailRequest'
      responses:
        '201':
          description: Email created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      summary: List emails filtered by recipient
      parameters:
        - in: query
          name: recipient
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Matching emails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/emails/{emailRef}:
    get:
      summary: Get one email
      parameters:
        - $ref: '#/components/parameters/EmailRef'
      responses:
        '200':
          description: Email found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/emails/{emailRef}/cancellation:
    post:
      summary: Cancel a queued email
      parameters:
        - $ref: '#/components/parameters/EmailRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: Cancellation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
    EmailRef:
      in: path
      name: emailRef
      required: true
      schema:
        type: string
  schemas:
    CreateEmailRequest:
      type: object
      required: [senderRef, contactRef, subject, bodyText]
      properties:
        senderRef:
          type: string
        contactRef:
          type: string
        subject:
          type: string
          minLength: 1
          maxLength: 200
        bodyText:
          type: string
          minLength: 1
          maxLength: 5000
        attachmentRef:
          type: string
          maxLength: 200
    ChangeStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CANCELLED]
    EmailResponse:
      type: object
      properties:
        emailRef: {type: string}
        senderRef: {type: string}
        contactRef: {type: string}
        recipientEmail: {type: string, format: email}
        subject: {type: string}
        bodyText: {type: string}
        attachmentRef: {type: string, nullable: true}
        status: {type: string, enum: [QUEUED, CANCELLED]}
        createdAt: {type: string, format: date-time}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: Domain validation failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: Downstream dependency unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
