spring.application.name=scm-contact-share-service
server.port=8090
server.compression.enabled=true
server.compression.mime-types=application/json,application/*+json
server.compression.min-response-size=512
contact.service.url=${CONTACT_SERVICE_URL:http://localhost:8082/v1/contacts}
scm.demo.bearer-token=${SCM_DEMO_BEARER_TOKEN:scm-assignment5-demo-token}
scm.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:100}
scm.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:*}
scm.method-override.enabled=${SCM_ENABLE_METHOD_OVERRIDE:false}
